name: fzu-checkin

on:
  workflow_dispatch:

concurrency:
  group: fzu-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch code
        run: |
          set -e
          BASE=https://raw.githubusercontent.com/Mahiroa/fzu-auto-checkin/main
          curl -fsSL "$BASE/main.py" -o main.py
          mkdir -p src
          for f in __init__ checkin config login notify schedule vacation; do
            curl -fsSL "$BASE/src/$f.py" -o "src/$f.py"
          done
          curl -fsSL "$BASE/requirements.txt" -o requirements.txt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Prepare config
        env:
          CONFIG_B64: ${{ secrets.CONFIG_YAML_B64 }}
        run: |
          echo "$CONFIG_B64" | base64 -d > config.yaml
          python -c "import yaml; d=yaml.safe_load(open('config.yaml',encoding='utf-8')); print('config ok', bool(d.get('user')), bool(d.get('checkin')))"
      - name: Run check-in now
        env:
          CHECKIN_FORCE: "1"
          PYTHONIOENCODING: utf-8
        run: python main.py
